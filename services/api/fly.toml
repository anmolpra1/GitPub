# fly.toml for GitPub REST API & BullMQ Worker
app = "gitpub-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ALLOW_LOCAL_CI_FALLBACK = "true"
  REPOS_ROOT = "/data/repos"
  SCRATCH_ROOT = "/scratch"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "gitpub_repos"
  destination = "/data/repos"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
